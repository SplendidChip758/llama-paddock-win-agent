# Checks for every pull request. The rulesets on main and dev require these
# jobs, so they run on every PR (no path filters): a required check that never
# starts would block docs-only PRs forever. A job skipped by its `if` counts as
# passed.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On Windows, where the agent and its installer run.
  agent:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # the oldest Node the agent supports
      - uses: actions/setup-node@v7
        with:
          node-version: 18.15

      - name: Agent parses
        run: node --check paddock-agent.mjs

      - name: Release script parses
        run: bash -n .github/scripts/prepare-release.sh

      - name: Installer scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in "install.ps1", "uninstall.ps1", ".github/scripts/build-setup.ps1", "test/service-mode.ps1", "test/service.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      # The dashboard tells which agents it can use from /health and /stats, so
      # the agent has to answer with the version and protocol on any change.
      - name: Agent answers
        run: |
          PADDOCK_AGENT_TOKEN=ci-token PADDOCK_DRY_RUN=1 PADDOCK_AGENT_PORT=11435 \
            PADDOCK_AGENT_TLS_KEY="$RUNNER_TEMP/agent.key" PADDOCK_AGENT_TLS_CERT="$RUNNER_TEMP/agent.crt" \
            node paddock-agent.mjs > "$RUNNER_TEMP/agent.log" 2>&1 &
          agent=$!
          # the setup test below needs the port
          trap 'kill "$agent"' EXIT
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:11435/health > health.json 2>/dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/agent.log"
          node -e '
            const h = JSON.parse(require("fs").readFileSync("health.json", "utf8"));
            if (typeof h.version !== "string" || !Number.isInteger(h.protocol) || h.platform !== "windows") throw new Error("bad /health: " + JSON.stringify(h));
            console.log(`agent ${h.version}, protocol ${h.protocol}`);
          '
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:11435/stats)" = 401
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:11435/stats > /dev/null

      - name: Service program and stub Ollama build
        shell: pwsh
        run: |
          dotnet build service -c Release -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build test/fake-ollama -c Release -o "$env:RUNNER_TEMP\fake-ollama" -nologo

      # the agent's service mode without the service, on the oldest Node it supports
      - name: Service mode
        shell: pwsh
        run: ./test/service-mode.ps1 -FakeOllama "$env:RUNNER_TEMP\fake-ollama\ollama.exe"

      - name: Setup builds
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./.github/scripts/build-setup.ps1 -Version 0.0.0-ci

      # installs the service on the runner over a faked scheduled-task install, upgrades it, uninstalls it
      - name: Setup installs, upgrades and uninstalls
        shell: pwsh
        run: ./test/service.ps1 -Setup dist/llama-paddock-agent-setup.exe -FakeOllama "$env:RUNNER_TEMP\fake-ollama\ollama.exe"

      - name: Service logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem "$env:ProgramData\llama-paddock-agent\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $_"; Get-Content $_ -Tail 60 }

  # PRs into main are merged with a merge commit, so every commit in them reaches
  # semantic-release, not just the PR title. PRs into dev are squash-merged, and
  # the pr-title check covers them.
  commits:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|perf|revert|docs|refactor|style|test|build|ci|chore'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" \
            | grep -Ev "^[0-9a-f]+ (($types)(\([a-z0-9-]+\))?!?: .+|Revert \")" || true)
          if [[ -n $bad ]]; then
            echo "::error::These commits aren't Conventional Commits (see CONTRIBUTING.md):"
            echo "$bad"
            exit 1
          fi
