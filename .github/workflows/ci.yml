# Checks for every pull request. The rulesets on main and dev require these
# jobs, so they run on every PR (no path filters): a required check that never
# starts would block docs-only PRs forever. A job skipped by its `if` counts as
# passed.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The setup, end to end: built as a release builds it, installed over a
  # running Node agent, the service through the tray app, an upgrade and an
  # uninstall (test/service.ps1).
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # the Node agent the setup moves over from
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 .github, test) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Build the setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./.github/scripts/build-setup.ps1 -Version 0.0.0-ci

      # the setup from this run, to try it on a real PC: the run's Artifacts section
      - uses: actions/upload-artifact@v7
        with:
          name: llama-paddock-agent-setup
          path: |
            dist/llama-paddock-agent-setup.exe
            dist/SHA256SUMS

      - name: Build the fake Ollama
        run: dotnet build test/fake-ollama -c Release -o "$env:RUNNER_TEMP/fake-ollama" -warnaserror

      - name: Install, use, upgrade and uninstall
        shell: pwsh
        run: ./test/service.ps1 -Setup dist/llama-paddock-agent-setup.exe -FakeOllama "$env:RUNNER_TEMP/fake-ollama/ollama.exe"

  # The C# agent replaces the Node agent (test/legacy), so the two have to
  # answer the same: test/compare.mjs runs both on the same files.
  compare:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the C# agent
        run: dotnet build agent -c Release -warnaserror

      - name: Build the tray app
        run: dotnet build tray -c Release -warnaserror

      # a stand-in ollama.exe with a model runner, for /stats to find
      - name: Build the fake Ollama
        run: dotnet build test/fake-ollama -c Release -o "$RUNNER_TEMP/fake-ollama" -warnaserror

      - name: Both agents answer the same
        # --tray: also run the C# agent as the service does, with and without the tray app
        # --restart: also restart the fake Ollama through each agent, out of dry run
        run: >-
          node test/compare.mjs agent/bin/Release/net10.0-windows/paddock-agent.exe "$RUNNER_TEMP/fake-ollama/ollama.exe"
          --tray=tray/bin/Release/net10.0-windows/paddock-agent-tray.exe --restart

  # PRs into main are merged with a merge commit, so every commit in them reaches
  # semantic-release, not just the PR title. PRs into dev are squash-merged, and
  # the pr-title check covers them.
  commits:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|perf|revert|docs|refactor|style|test|build|ci|chore'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" \
            | grep -Ev "^[0-9a-f]+ (($types)(\([a-z0-9-]+\))?!?: .+|Revert \")" || true)
          if [[ -n $bad ]]; then
            echo "::error::These commits aren't Conventional Commits (see CONTRIBUTING.md):"
            echo "$bad"
            exit 1
          fi
