# The GitHub Actions, and the agent's NuGet packages (the .NET runtime comes with the SDK CI installs).
# Updates target dev, like every other change.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directories: ["/agent", "/tray"]
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
